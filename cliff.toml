[changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
# Parse conventional commit scopes/messages correctly
conventional_commits = true
filter_unconventional = false

# Enable splitting multi-line commit bodies into separate changelog items
split_commits = true
protect_breaking_commits = true

# Skip noisy commits that don't belong in user-facing notes
skip_tags = ""
ignore_tags = ""
filter_commits = false

commit_parsers = [
    # --- Core Changes ---
    { message = "^[\\-*]?[[:space:]]*feat", group = "🚀 Features" },
    { message = "^[\\-*]?[[:space:]]*fix", group = "🐛 Bug Fixes" },
    { message = "^[\\-*]?[[:space:]]*perf", group = "⚡ Performance" },

    # --- Code Quality & Architecture ---
    { message = "^[\\-*]?[[:space:]]*refactor", group = "🚜 Refactoring" },
    { message = "^[\\-*]?[[:space:]]*style", group = "🎨 Styling & Formatting" },
    { message = "^[\\-*]?[[:space:]]*test", group = "🧪 Testing" },

    # --- Project Maintenance ---
    { message = "^[\\-*]?[[:space:]]*doc", group = "📚 Documentation" },
    { message = "^[\\-*]?[[:space:]]*build", group = "📦 Build System" },
    { message = "^[\\-*]?[[:space:]]*ci", group = "⚙️ Continuous Integration" },
    { message = "^[\\-*]?[[:space:]]*chore\\(release\\)", skip = true },            # Hide automated release/version bump commits
    { message = "^[\\-*]?[[:space:]]*chore\\(deps\\)", group = "🛠️ Dependencies" },
    { message = "^[\\-*]?[[:space:]]*chore", group = "🧹 Chores" },
    { message = "^[\\-*]?[[:space:]]*revert", group = "◀️ Reverts" },

    # --- Noise Reduction ---
    { message = "^Merge", skip = true }, # Skip standard Git merge commits

    # --- Catch-All ---
    { message = ".*", group = "💡 Other Changes" },
]

# Sort commits within each group chronologically
sort_commits = "oldest"

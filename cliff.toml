[changelog]
header = "# Changelog\n\n"

body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    {%- if entry.commits %}
    ### {{ entry.group | upper_first }}
    
    {%- if entry.group == "🛠️ Dependencies" %}
        {%- for scope, scope_commits in entry.commits | group_by(attribute="scope") %}
            {%- if scope != "deps" and scope != "" %}
                {# Specific package bumps (e.g. clap) -> Only output the newest one, hardcode (deps) #}
                {%- set commit = scope_commits | last %}
                - (**deps**) {{ commit.message | upper_first | trim }}
            {%- else %}
                {# Generic deps updates -> Loop through all normally, hardcode (deps) #}
                {%- for commit in scope_commits | unique(attribute="message") %}
                    - (**deps**) {{ commit.message | upper_first | trim }}
                {%- endfor %}
            {%- endif %}
        {%- endfor %}
        
    {%- else %}
        {# Standard rendering for all other sections #}
        {%- for scope, scope_commits in entry.commits | group_by(attribute="scope") %}
            {%- for commit in scope_commits | unique(attribute="message") %}
                - {% if commit.scope %}(**{{ commit.scope }}**) {% endif -%}
                {%- if commit.message is starting_with("ci(deps)") -%}
                    {{ commit.message | split(pat="\n") | nth(n=1) | upper_first | trim }}
                {%- else -%}
                    {{ commit.message | upper_first | trim }}
                {%- endif -%}
            {%- endfor %}
        {%- endfor %}
    {%- endif %}
    {%- endif %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = true
protect_breaking_commits = true
filter_commits = false

commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🚜 Refactoring" },
    { message = "^style", group = "🎨 Styling & Formatting" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^build", group = "📦 Build System" },
    { message = "^ci", group = "⚙️ Continuous Integration" },
    { message = ".*chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\): [Bb]ump (?P<scope>\\S+)", group = "🛠️ Dependencies" },
    { message = "^chore\\(deps\\)", group = "🛠️ Dependencies" },
    { message = "^chore", group = "🧹 Chores" },
    { message = "^revert", group = "◀️ Reverts" },
    { message = "^Merge", skip = true },
    { message = ".*", skip = true },
]

sort_commits = "oldest"

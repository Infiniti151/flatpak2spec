name: build-attest-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify-and-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            use_cross: true
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.set_version.outputs.tag }}
      release_number: ${{ steps.set_version.outputs.release_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine Target Version and Tag
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(git describe --tags --abbrev=0)
            echo "Manual dispatch triggered. Auto-detected latest tag: $TAG"
          else
            TAG="${{ github.ref_name }}"
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_number=$VERSION" >> $GITHUB_OUTPUT

          # Set step environment variables for this job
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Verify SSH-Signed Tag
        env:
          ALLOWED_KEY: ${{ secrets.RELEASE_SSH_PUBLIC_KEY }}
        run: |
          echo "Verifying SSH signature for tag: $TAG"

          if [ -z "$ALLOWED_KEY" ]; then
            echo "ERROR: RELEASE_SSH_PUBLIC_KEY secret is not set!"
            exit 1
          fi

          mkdir -p ~/.config/git
          echo "$ALLOWED_KEY" > ~/.config/git/allowed_signers

          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile ~/.config/git/allowed_signers

          if ! git tag -v "$TAG"; then
            echo "ABORTING: Tag '$TAG' is missing a valid signature from the allowed SSH key!"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross-compilation Tools
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Tarball
        run: |
          TAR_NAME="flatpak2spec-${VERSION}-${ARCH}.tar.gz"
          BIN_NAME="flatpak2spec-${VERSION}"

          # Create tarball containing the compiled binary, LICENSE, and README.md
          tar -czvf "$GITHUB_WORKSPACE/$TAR_NAME" \
            -C "target/${{ matrix.target }}/release" "$BIN_NAME" \
            LICENSE README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.arch }}
          path: "flatpak2spec-${{ steps.set_version.outputs.release_number }}-${{ matrix.arch }}.tar.gz"

  publish-release:
    name: Create Release & Sync Spec
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
      actions: read
    outputs:
      release_number: ${{ needs.verify-and-build.outputs.release_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse Changelog & Update Spec
        run: |
          VERSION="${{ needs.verify-and-build.outputs.release_number }}"

          awk '/^## \[/ { if (count++) exit } count { print }' CHANGELOG.md | grep -v '^#' > release_notes.md

          DATE_STR=$(date "+%a %b %d %Y")
          CHLOG_HDR="* $DATE_STR Infiniti151 <43163551+Infiniti151@users.noreply.github.com> - ${VERSION}-1"

          CLEAN_BODY=$(sed '/^$/d' release_notes.md)

          sed -i "s/^Version:[[:space:]]*.*/Version:        ${VERSION}/" flatpak2spec.spec

          cat <<EOF > changelog.tmp
          $CHLOG_HDR
          $CLEAN_BODY

          EOF

          sed -i '/%changelog/r changelog.tmp' flatpak2spec.spec
          rm -f changelog.tmp

      - name: Commit Spec Updates via Suzuki Commit Action
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branch: main
          commit_message: "🤖 chore(release): update spec file for ${{ needs.verify-and-build.outputs.tag }}"
          files: flatpak2spec.spec
          fail_on_self_push: false

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest tarball archives
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.verify-and-build.outputs.tag }}
          name: ${{ needs.verify-and-build.outputs.tag }}
          files: release-assets/*.tar.gz
          body_path: release_notes.md

  trigger-copr:
    name: Trigger Copr Build via Webhook
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger COPR Build via API
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_PACKAGE_WEBHOOK_URL }}
          RELEASE_NUMBER: ${{ needs.publish-release.outputs.release_number }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::error::COPR_PACKAGE_WEBHOOK_URL secret is not set! Cannot trigger build."
            exit 1
          fi

          echo "Triggering COPR build for release v${RELEASE_NUMBER}..."

          BASE_URL=$(echo "$COPR_WEBHOOK_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/flatpak2spec/"
          MAX_RETRIES=3
          DELAY=5
          SUCCESS=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i of $MAX_RETRIES..."

            if curl -fsSL -X POST "$FINAL_URL"; then
              echo "Successfully triggered COPR build!"
              SUCCESS=true
              break
            else
              echo "::warning::Attempt $i failed to reach COPR webhook."
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${DELAY} seconds..."
                sleep $DELAY
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "::error::Failed to trigger COPR build after $MAX_RETRIES attempts."
            exit 1
          fi
name: build-attest-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  BIN_NAME: ${{ github.event.repository.name }}
  SPEC_FILE: ${{ github.event.repository.name }}.spec

jobs:
  verify-and-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            use_cross: true
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.set_version.outputs.tag }}
      release_number: ${{ steps.set_version.outputs.release_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine Target Version and Tag
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(git describe --tags --abbrev=0)
            echo "Manual dispatch triggered. Auto-detected latest tag: $TAG"
          else
            TAG="${{ github.ref_name }}"
          fi

          VERSION="${TAG#v}"

          echo "Detected Git Tag Version: $VERSION"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_number=$VERSION" >> $GITHUB_OUTPUT

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Verify SSH-Signed Tag
        env:
          ALLOWED_KEY: ${{ secrets.RELEASE_SSH_PUBLIC_KEY }}
        run: |
          echo "Verifying SSH signature for tag: $TAG"

          if [ -z "$ALLOWED_KEY" ]; then
            echo "ERROR: RELEASE_SSH_PUBLIC_KEY secret is not set!"
            exit 1
          fi

          mkdir -p ~/.config/git
          echo "$ALLOWED_KEY" > ~/.config/git/allowed_signers

          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile ~/.config/git/allowed_signers

          if ! git tag -v "$TAG"; then
            echo "ABORTING: Tag '$TAG' is missing a valid signature from the allowed SSH key!"
            exit 1
          fi

      - name: Sync Cargo.toml Version
        run: |
          sed -i -E "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross-compilation Tools
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Tarball
        run: |
          TAR_NAME="${BIN_NAME}-${VERSION}-${ARCH}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "./${BIN_NAME}"
          tar -czvf "$GITHUB_WORKSPACE/$TAR_NAME" "$BIN_NAME" LICENSE README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.arch }}
          path: "${{ env.BIN_NAME }}-${{ steps.set_version.outputs.release_number }}-${{ matrix.arch }}.tar.gz"

  publish-release:
    name: Create Release & Sync Spec
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
      actions: read
    outputs:
      release_number: ${{ env.VERSION }}
    env:
      VERSION: ${{ needs.verify-and-build.outputs.release_number }}
      TAG: ${{ needs.verify-and-build.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync Cargo.toml and Cargo.lock Version
        run: |
          sed -i -E "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i -E "/name = \"${BIN_NAME}\"/,/version =/ s/(version = \")[^\"]*(\")/\1${VERSION}\2/" Cargo.lock

      - name: Generate Latest Release Notes with git-cliff
        uses: orhun/git-cliff-action@5d3a6702d0a4ea1318aab88bd87a9d3df156eb0f # v2.13.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release_notes.md

      - name: Prepend Latest Release to CHANGELOG.md
        uses: orhun/git-cliff-action@5d3a6702d0a4ea1318aab88bd87a9d3df156eb0f # v2.13.1
        with:
          config: cliff.toml
          args: --latest --prepend CHANGELOG.md

      - name: Format Changelog for Spec File
        run: |
          sed -i "s/^Version:[[:space:]]*.*/Version:        ${VERSION}/" "$SPEC_FILE"

          DATE_STR=$(date "+%a %b %d %Y")
          CHLOG_HDR="* $DATE_STR Infiniti151 <43163551+Infiniti151@users.noreply.github.com> - ${VERSION}-1"

          RAW_ENTRIES=$(grep -E '^[[:space:]]*[-*]' release_notes.md | sed -E 's/^[[:space:]]*[-*][[:space:]]*/- /' | sed -E 's/\*//g' | sed -E 's/\([a-f0-9]{7,40}\)//g')

          TOTAL_LINES=$(echo "$RAW_ENTRIES" | grep -c '^')
          if [ "$TOTAL_LINES" -gt 10 ]; then
            FORMATTED_BODY=$(echo "$RAW_ENTRIES" | head -n 10)
            FORMATTED_BODY+=$'\n- ... see upstream for full release notes'
          else
            FORMATTED_BODY="$RAW_ENTRIES"
          fi

          cat <<EOF > changelog.tmp
          $CHLOG_HDR
          $FORMATTED_BODY

          EOF

          sed -i '/%changelog/r changelog.tmp' "$SPEC_FILE"
          rm -f changelog.tmp

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Sign Tarball Archives with SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.RELEASE_SSH_PASSPHRASE }}
          SSH_AUTH_SOCK: "" # Prevents ssh-agent interference
        run: |
          set -e

          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_PASSPHRASE" ]]; then
            echo "::error::RELEASE_SSH_PRIVATE_KEY or RELEASE_SSH_PASSPHRASE secret is missing!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key

          trap 'rm -f ~/.ssh/release_key' EXIT

          shopt -s nullglob
          tarballs=(release-assets/*.tar.gz)

          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::error::No tarballs found in release-assets/!"
            exit 1
          fi

          for tarball in "${tarballs[@]}"; do
            echo "Signing $tarball..."

            export CURRENT_TARBALL="$tarball"

            expect -c '
              spawn ssh-keygen -Y sign -f $env(HOME)/.ssh/release_key -n file $env(CURRENT_TARBALL)
              expect {
                "Enter passphrase*" {
                  send "$env(SSH_PASSPHRASE)\r"
                  exp_continue
                }
                timeout {
                  send_user "\n::error file=$env(CURRENT_TARBALL),title=Signing Timeout::Timed out waiting for passphrase prompt while signing $env(CURRENT_TARBALL)\n"
                  exit 1
                }
                eof
              }

              # Capture the exit status of ssh-keygen
              catch wait result
              set exit_code [lindex $result 3]

              if { $exit_code != 0 } {
                send_user "\n::error file=$env(CURRENT_TARBALL),title=Signing Failed::ssh-keygen failed with exit code $exit_code for $env(CURRENT_TARBALL)\n"
                exit $exit_code
              }
            '
          done

      - name: Attest tarball archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: release-assets/*.tar.gz

      - name: Commit Updates
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branch: main
          commit_message: "🤖 chore(release): update release metadata for ${{ env.TAG }}"
          files: |
            ${{ env.SPEC_FILE }}
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          fail_on_self_push: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sig
          body_path: release_notes.md

  trigger-copr:
    name: Trigger Copr Build via Webhook
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger COPR Build via API
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_PACKAGE_WEBHOOK_URL }}
          RELEASE_NUMBER: ${{ needs.publish-release.outputs.release_number }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::error::COPR_PACKAGE_WEBHOOK_URL secret is not set! Cannot trigger build."
            exit 1
          fi

          echo "Triggering COPR build for release v${RELEASE_NUMBER}..."

          BASE_URL=$(echo "$COPR_WEBHOOK_URL" | xargs)
          FINAL_URL="${BASE_URL%/}/${BIN_NAME}/"
          MAX_RETRIES=3
          DELAY=5
          SUCCESS=false

          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i of $MAX_RETRIES..."

            if curl -fsSL -X POST "$FINAL_URL"; then
              echo "Successfully triggered COPR build!"
              SUCCESS=true
              break
            else
              echo "::warning::Attempt $i failed to reach COPR webhook."
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Retrying in ${DELAY} seconds..."
                sleep $DELAY
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "::error::Failed to trigger COPR build after $MAX_RETRIES attempts."
            exit 1
          fi